spring.application.name=resume-analyzer

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate: create/update tables automatically from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload limits (we'll need these in Phase 2)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.web.error.include-message=always
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
app.jwt.expiry-hours=24